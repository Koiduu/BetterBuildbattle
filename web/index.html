<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Better Battle</title>
<meta name="description" content="Build Battle rankings, profiles and achievements. Better Battle by Koidu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/" data-link>
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 20h16"/><path d="M6 20V10l6-6 6 6v10"/><path d="M10 20v-5h4v5"/></svg>
      </span>
      <span>Better Battle</span>
    </a>
    <nav class="pills" aria-label="Main">
      <a href="/" data-link data-nav="home">Home</a>
      <a href="/leaderboard" data-link data-nav="leaderboard">Leaderboard</a>
    </nav>
    <div class="top-right">
      <form class="search" role="search" id="search-form">
        <label for="search-input" class="sr-only">Find a player</label>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" name="q" placeholder="Find a player" autocomplete="off" maxlength="16" spellcheck="false">
        <ul class="suggest" id="suggest" role="listbox" hidden></ul>
      </form>
      <a class="account-link" id="account-link" href="/login" data-link>Log in</a>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <span>Better Battle, made by Koidu</span>
    <span>Not affiliated with Hypixel. Stats from the Hypixel API.</span>
  </footer>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
