<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Votes · Better Battle admin</title>
<link rel="stylesheet" href="/style.css">
<style>
  .votebar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--card-2); min-width: 220px; }
  .votebar span { height: 100%; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
  .keys i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .login { display: flex; gap: 8px; flex-wrap: wrap; max-width: 520px; }
  .login input { flex: 1 1 260px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.1); background: var(--card); color: var(--text); font: inherit; }
  tbody tr { cursor: pointer; }
  tbody tr.static { cursor: default; }
  tbody tr:hover td { background: rgba(255,255,255,.02); }
  .report-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .report-log { max-height: 70vh; overflow: auto; padding: 12px; background: #000; border: 2px solid var(--edge); color: var(--soft); font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  tr[data-report] { cursor: pointer; }
  tr[data-gtb] { cursor: pointer; }
  .gtb-score { display: inline-block; min-width: 38px; padding: 2px 8px; border-radius: 999px; text-align: center; font-weight: 700; background: var(--card-2); }
  .gtb-score.strong { background: #5a3b12; color: #ffcc4d; }
  .gtb-evidence { margin: 8px 0 14px 18px; color: var(--soft); }
  .gtb-evidence li { margin: 3px 0; }
  .gtb-note { width: 100%; min-height: 90px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: var(--card); color: var(--text); font: inherit; }
  td.hit { color: #ffcc4d; font-weight: 700; }
  .head-review { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px; background: var(--card-2); border: 2px solid var(--edge); }
  .head-review + .head-review { margin-top: 8px; }
  .head-strip { width: 320px; height: 80px; background-size: 320px 320px, 20px 20px; background-repeat: no-repeat, repeat; image-rendering: pixelated; border: 2px solid var(--edge);
    background-color: #2a2a30; background-image: var(--png), repeating-conic-gradient(#26262c 0 25%, #1c1c21 0 50%); }
  .head-strip.big { width: 640px; height: 160px; background-size: 640px 640px, 20px 20px; }
  .head-review .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .head-review .actions { display: flex; flex-direction: column; gap: 6px; }
  .head-review .actions input { height: 30px; padding: 0 10px; background: var(--card); border: 2px solid var(--edge); color: var(--text); font: inherit; }
  .head-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .head-tabs .btn[aria-pressed="true"] { outline: 2px solid var(--gold); }
  @media (max-width: 900px) { .head-review { grid-template-columns: 1fr; } .head-strip { width: 100%; max-width: 320px; } }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 20h16"/><path d="M6 20V10l6-6 6 6v10"/><path d="M10 20v-5h4v5"/></svg>
      </span>
      <span>Better Battle</span>
    </a>
    <span class="chip pink">Admin</span>
  </header>
  <main id="app"></main>
</div>
<script type="module">
const COLORS = {
  super_poop: "#8a3b2a", poop: "#b5651d", meh: "#7d7489", ok: "#7ab8ff",
  good: "#7ee08a", epic: "#c78bff", legendary: "#ffcc4d",
};
const LABELS = {
  super_poop: "Super Poop", poop: "Poop", meh: "Meh", ok: "OK",
  good: "Good", epic: "Epic", legendary: "Legendary",
};
const app = document.getElementById("app");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const num = (n) => Number(n).toLocaleString("en-US");

let token = "";
try { token = localStorage.getItem("bb_admin") || ""; } catch {}

async function get(path) {
  const res = await fetch("/bb/v1" + path, { headers: { "x-admin-token": token } });
  if (res.status === 404) throw new Error("locked");
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function post(path, body) {
  const res = await fetch("/bb/v1" + path, {
    method: "POST", headers: { "x-admin-token": token, "content-type": "application/json" }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

const when = (iso) => new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const STATUS = { new: "New", looked: "Looked at", fixed: "Fixed" };

/** Switch an account between Builder, Architect and Master Builder to see the site as that plan. */
async function planSection(el) {
  let name = "";
  try { name = localStorage.getItem("bb_admin_name") || ""; } catch {}
  el.innerHTML = `
    <div class="card-head"><div><h2>View the site as a plan</h2>
      <p class="sub">Pick a Minecraft name (yours), then a plan. It really changes that account to the plan, for free, so profile, share card, leaderboards and Discord all show what that tier sees. Switch back any time. Accounts with a real Stripe subscription can't be changed here.</p></div></div>
    <form class="login" id="plan-form">
      <label class="sr-only" for="plan-name">Minecraft name</label>
      <input id="plan-name" autocomplete="off" placeholder="Your Minecraft name" maxlength="16" value="${esc(name)}">
      <button class="btn" type="button" data-plan="free">Builder (free)</button>
      <button class="btn" type="button" data-plan="architect">Architect</button>
      <button class="btn" type="button" data-plan="master">Master Builder</button>
    </form>
    <p class="sub" id="plan-status" style="margin-top:12px"></p>`;
  const input = el.querySelector("#plan-name");
  const status = el.querySelector("#plan-status");
  const LABEL = { free: "Builder (free)", architect: "Architect", master: "Master Builder" };
  const show = (d) => {
    status.innerHTML = `<b>${esc(d.name)}</b> is on <b>${LABEL[d.plan]}</b>${d.comped ? " (set by you)" : ""}. <a href="/p/${encodeURIComponent(d.name)}" target="_blank" rel="noopener">Open their profile</a> · <a href="/plans" target="_blank" rel="noopener">Plans page</a>`;
  };
  async function load() {
    const n = input.value.trim();
    if (!n) { status.textContent = ""; return; }
    try { localStorage.setItem("bb_admin_name", n); } catch {}
    try { show(await get("/admin/plan/" + encodeURIComponent(n))); }
    catch { status.textContent = "No account with that name yet. Log in with the mod once, then try again."; }
  }
  input.addEventListener("change", load);
  el.querySelector("#plan-form").addEventListener("submit", (e) => { e.preventDefault(); load(); });
  for (const b of el.querySelectorAll("button[data-plan]")) b.addEventListener("click", async () => {
    const n = input.value.trim();
    if (!n) { status.textContent = "Type your Minecraft name first."; return; }
    try {
      await post("/admin/plan", { name: n, plan: b.dataset.plan });
      await load();
    } catch (err) {
      status.textContent = err.message === "HTTP 404"
        ? "Couldn't change it: no such account, or it has a real subscription."
        : "Couldn't change it (" + err.message + ").";
    }
  });
  load();
}

/** Everyone who has the mod installed (has logged in with it at least once). */
async function modUsersSection(el) {
  let users;
  try { users = await get("/admin/mod-users"); } catch { el.innerHTML = `<p class="empty">Couldn't load mod users.</p>`; return; }
  const day = 24 * 60 * 60 * 1000;
  const recent = users.filter((u) => Date.now() - new Date(u.last_seen_at ?? u.last_login) < 7 * day).length;
  el.innerHTML = `
    <div class="card-head"><div><h2>Mod users</h2>
      <p class="sub">${num(users.length)} player${users.length === 1 ? "" : "s"} have logged in with the mod, ${num(recent)} in the last 7 days. Versions come from their latest synced game.</p></div></div>
    ${users.length ? `
    <div class="table-scroll"><table>
      <thead><tr><th>Player</th><th>Version</th><th class="right">Games</th><th>First seen</th><th>Last seen</th></tr></thead>
      <tbody>${users.map((u) => `
        <tr class="static">
          <td><b>${esc(u.mc_name ?? u.mc_uuid)}</b></td>
          <td>${u.mod_version ? `${esc(u.mod_version)} · ${esc(u.mc_version)}` : `<span class="muted">no games yet</span>`}</td>
          <td class="right">${num(u.games)}</td>
          <td>${esc(when(u.first_login))}</td>
          <td>${esc(when(u.last_seen_at ?? u.last_login))}</td>
        </tr>`).join("")}</tbody>
    </table></div>` : `<p class="empty">No mod users yet. They appear after someone logs in with the mod.</p>`}`;
}

const GTB_STATUS = { open: "Open", dismissed: "Dismissed", reported: "Passed to Hypixel" };
const secs = (ms) => (ms == null ? "–" : (ms / 1000).toFixed(1) + " s");

/**
 * Guess the Build: players whose guessing looks unusual to several mod users. Evidence to check before passing
 * anything to Hypixel, never a verdict. None of this is shown anywhere public.
 */
async function gtbSection(el) {
  let d;
  try { d = await get("/admin/gtb"); } catch { el.innerHTML = `<p class="empty">Couldn't load Guess the Build cases.</p>`; return; }
  const c = d.config;
  const strong = d.cases.filter((x) => x.status === "open" && x.strong).length;
  el.innerHTML = `
    <div class="card-head"><div><h2>Guess the Build: unusual guessing</h2>
      <p class="sub">Players seen in at least ${c.minRounds} rounds by at least ${c.minReporters} different mod users, strongest first.
      ${num(strong)} open case${strong === 1 ? "" : "s"} score ${c.showScore}+ and show a private hint in game. Scores are worked out again without
      the most damning reporter${c.dropTopReporters === 1 ? "" : "s"}, and the lower one counts. This is evidence to check, not proof:
      fast typists and familiar themes look like this too. ${num(d.totals.events)} guesses about ${num(d.totals.players)} players from
      ${num(d.totals.reporters)} mod users, kept ${c.keepDays} days.</p></div></div>
    ${d.cases.length ? `
    <div class="table-scroll"><table>
      <thead><tr><th>Player</th><th class="right">Score</th><th class="right">Rounds</th><th class="right">Reporters</th>
        <th class="right">No letters</th><th class="right">Too fast</th><th class="right">Median</th><th>Status</th></tr></thead>
      <tbody>${d.cases.map((x) => `
        <tr data-gtb="${esc(x.name)}">
          <td><b>${esc(x.name)}</b></td>
          <td class="right"><span class="gtb-score${x.strong ? " strong" : ""}">${x.score}</span></td>
          <td class="right">${num(x.rounds)}</td>
          <td class="right">${num(x.reporters)}</td>
          <td class="right">${x.signals.noHint.hits}/${x.signals.noHint.of}</td>
          <td class="right">${x.signals.fastStart.hits}/${x.signals.fastStart.of}</td>
          <td class="right num">${secs(x.medianMs)}</td>
          <td>${esc(GTB_STATUS[x.status] ?? x.status)}${x.note ? " · note" : ""}</td>
        </tr>`).join("")}</tbody>
    </table></div>` : `<p class="empty">Nobody has enough rounds and reporters yet. Cases show up once mod users have played Guess the Build with the same players.</p>`}`;
  for (const row of el.querySelectorAll("tr[data-gtb]")) row.addEventListener("click", () => gtbCase(row.dataset.gtb));
}

async function gtbCase(name) {
  let x;
  try { x = await get("/admin/gtb/" + encodeURIComponent(name)); } catch { return overview(); }
  const hit = (b) => (b ? `<td class="hit">yes</td>` : `<td class="muted">–</td>`);
  app.innerHTML = `
    <section class="card">
      <div class="card-head">
        <div><h2>${esc(x.name)}</h2><p class="sub">Score ${x.score} (${x.rawScore} with every reporter) · ${num(x.rounds)} rounds ·
          ${num(x.reporters)} reporters · ${num(x.confirmedRounds)} rounds seen by two or more${x.uuid ? ` · UUID <code>${esc(x.uuid)}</code>` : ""}
          ${x.droppedReporters.length ? ` · left out of the score: ${x.droppedReporters.map(esc).join(", ")}` : ""}</p></div>
        <button class="btn" id="back">Back</button>
      </div>
      <ul class="gtb-evidence">${x.evidence.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
      <p class="sub">Check the rounds below before passing anything on. Rounds one reporter saw alone count half; where reporters
        disagreed, the slower reading was used. Dismissing stops the in-game hint for this player.</p>
      <div class="report-actions">
        ${Object.entries(GTB_STATUS).map(([k, v]) => `<button class="btn small${x.status === k ? " primary" : ""}" data-gtb-status="${k}">${v}</button>`).join("")}
      </div>
      <label class="sr-only" for="gtb-note">Notes</label>
      <textarea class="gtb-note" id="gtb-note" maxlength="2000" placeholder="Private notes, e.g. what you checked and when you reported it">${esc(x.note)}</textarea>
      <div class="report-actions"><button class="btn small" id="gtb-save">Save note</button><span class="sub" id="gtb-saved"></span></div>
      <h2 style="margin:18px 0 10px">Every round</h2>
      <div class="table-scroll"><table>
        <thead><tr><th>When</th><th>Game</th><th class="right">Round</th><th>Word</th><th class="right">Guessed at</th>
          <th class="right">Letters</th><th class="right">After letter</th><th>No letters</th><th>Too fast</th><th>Right after letter</th>
          <th class="right">Weight</th><th>Reporters</th></tr></thead>
        <tbody>${x.detail.map((r) => `
          <tr class="static">
            <td>${r.seenAt ? esc(when(r.seenAt)) : "–"}</td>
            <td><code>${esc(r.gameKey)}</code></td>
            <td class="right">${r.round}</td>
            <td>${esc(r.word ?? "?")}${r.length ? ` <span class="muted">(${r.length})</span>` : ""}</td>
            <td class="right num">${secs(r.ms)}</td>
            <td class="right">${r.revealed}</td>
            <td class="right num">${secs(r.msSinceReveal)}</td>
            ${hit(r.flags.noHint)}${hit(r.flags.fastStart)}${hit(r.flags.fastReveal)}
            <td class="right">${r.weight}</td>
            <td>${r.allReporters.map((n) => r.reporters.includes(n) ? esc(n) : `<s class="muted" title="Too far from the others; left out">${esc(n)}</s>`).join(", ")}</td>
          </tr>`).join("")}</tbody>
      </table></div>
    </section>`;
  document.getElementById("back").addEventListener("click", overview);
  const review = (body) => post(`/admin/gtb/${encodeURIComponent(x.name)}/review`, body);
  for (const b of app.querySelectorAll("[data-gtb-status]")) {
    b.addEventListener("click", async () => { await review({ status: b.dataset.gtbStatus }).catch(() => {}); gtbCase(x.name); });
  }
  document.getElementById("gtb-save").addEventListener("click", async () => {
    const saved = document.getElementById("gtb-saved");
    try { await review({ note: document.getElementById("gtb-note").value }); saved.textContent = "Saved."; }
    catch { saved.textContent = "Couldn't save."; }
  });
}

/** LFG lobbies players reported. Enough reports hide the name ("Lobby") until it is reviewed here. */
async function lobbiesSection(el) {
  let d;
  try { d = await get("/admin/lfg/reported"); } catch { el.innerHTML = `<p class="empty">Couldn't load reported lobbies.</p>`; return; }
  const TAG = { teams: "Teams", solo: "Solo", gtb: "GTB", spb: "SPB", pro: "Pro", other: "Other" };
  el.innerHTML = `
    <div class="card-head"><div><h2>Reported lobbies</h2>
      <p class="sub">LFG lobbies players reported from the mod. ${num(d.reportsToHide)} reports from different players hide the name until you review it here. Keep or rename to unhide; Close ends the lobby.</p></div></div>
    ${d.lobbies.length ? `
    <div class="table-scroll"><table>
      <thead><tr><th>Name</th><th>Host</th><th>Tag</th><th class="right">Reports</th><th>Reported by</th><th>State</th><th></th></tr></thead>
      <tbody>${d.lobbies.map((l) => `
        <tr class="static" data-lobby="${esc(l.id)}">
          <td><b>${esc(l.name)}</b>${(l.reported_names ?? []).filter((n) => n !== l.name).map((n) => `<br><span class="muted">was: ${esc(n)}</span>`).join("")}</td>
          <td>${esc(l.host)}${l.host_banned ? ` <span class="muted">(can't host)</span>` : ""}</td>
          <td>${esc(TAG[l.tag] ?? l.tag)}</td>
          <td class="right">${num(l.reports)}</td>
          <td>${esc((l.reporters ?? []).join(", "))}</td>
          <td>${l.status === "open" ? "Open" : "Closed"}${l.name_hidden ? " · name hidden" : ""}</td>
          <td style="white-space:nowrap">
            <button class="btn" data-act="keep">Keep</button>
            <button class="btn" data-act="rename">Rename</button>
            ${l.status === "open" ? `<button class="btn" data-act="close">Close</button>` : ""}
            <button class="btn" data-act="ban" data-host="${esc(l.host)}" data-banned="${l.host_banned ? "1" : ""}">${l.host_banned ? "Allow hosting" : "Block from hosting"}</button>
          </td>
        </tr>`).join("")}</tbody>
    </table></div>` : `<p class="empty">No reported lobbies.</p>`}`;
  for (const row of el.querySelectorAll("tr[data-lobby]")) {
    const id = row.dataset.lobby;
    for (const b of row.querySelectorAll("button[data-act]")) b.addEventListener("click", async () => {
      try {
        if (b.dataset.act === "keep") await post(`/admin/lfg/${id}/review`, {});
        if (b.dataset.act === "rename") {
          const name = prompt("New name for this lobby (up to 32 characters):", "Lobby");
          if (name === null) return;
          await post(`/admin/lfg/${id}/review`, { name: name.slice(0, 32) });
        }
        if (b.dataset.act === "close") await post(`/admin/lfg/${id}/close`, {});
        if (b.dataset.act === "ban") await post("/admin/lfg/host-ban", { name: b.dataset.host, banned: !b.dataset.banned });
      } catch (err) {
        alert("Couldn't do that (" + err.message + ").");
      }
      lobbiesSection(el);
    });
  }
}

/** Bug reports from /bb report. Loaded after the votes so a slow list doesn't hold them up. */
async function reportsSection(el) {
  let reports;
  try { reports = await get("/admin/reports"); } catch { el.innerHTML = `<p class="empty">Couldn't load bug reports.</p>`; return; }
  const open = reports.filter((r) => r.status === "new").length;
  el.innerHTML = `
    <div class="card-head"><div><h2>Bug reports</h2>
      <p class="sub">${num(reports.length)} from <code>/bb report</code>, ${num(open)} new. Game messages and scoreboard only; the mod leaves out all chat. Deleted after 90 days.</p></div></div>
    ${reports.length ? `
    <div class="table-scroll"><table>
      <thead><tr><th>#</th><th>When</th><th>Player</th><th>Version</th><th>What went wrong</th><th>Status</th></tr></thead>
      <tbody>${reports.map((r) => `
        <tr data-report="${r.id}">
          <td class="num">${r.id}</td><td>${esc(when(r.created_at))}</td><td><b>${esc(r.mc_name ?? "–")}</b></td>
          <td>${esc(r.mod_version)} · ${esc(r.mc_version)}</td>
          <td>${r.note ? esc(r.note.length > 80 ? r.note.slice(0, 79) + "…" : r.note) : `<span class="muted">no note</span>`}</td>
          <td>${esc(STATUS[r.status] ?? r.status)}</td>
        </tr>`).join("")}</tbody>
    </table></div>` : `<p class="empty">No reports yet. Players send them with /bb report.</p>`}`;
  for (const row of el.querySelectorAll("tr[data-report]")) row.addEventListener("click", () => report(row.dataset.report));
}

async function report(id) {
  let r;
  try { r = await get("/admin/reports/" + encodeURIComponent(id)); } catch { return overview(); }
  const file = URL.createObjectURL(new Blob([r.log], { type: "text/plain" }));
  app.innerHTML = `
    <section class="card">
      <div class="card-head">
        <div><h2>Report #${r.id}</h2><p class="sub">${esc(r.mc_name ?? "Unknown player")} · ${esc(when(r.created_at))} · mod ${esc(r.mod_version)} on ${esc(r.mc_version)}</p></div>
        <button class="btn" id="back">Back</button>
      </div>
      <p><b>What went wrong:</b> ${r.note ? esc(r.note) : `<span class="muted">no note</span>`}</p>
      <div class="report-actions">
        ${Object.entries(STATUS).map(([k, v]) => `<button class="btn small${r.status === k ? " primary" : ""}" data-status="${k}">${v}</button>`).join("")}
        <a class="btn small" href="${file}" download="report-${r.id}.txt">Download log</a>
      </div>
      <pre class="report-log">${esc(r.log)}</pre>
    </section>`;
  document.getElementById("back").addEventListener("click", overview);
  for (const b of app.querySelectorAll("[data-status]")) {
    b.addEventListener("click", async () => { await post(`/admin/reports/${r.id}/status`, { status: b.dataset.status }).catch(() => {}); report(r.id); });
  }
}

function keys() {
  return `<div class="keys">${Object.keys(LABELS).map((k) => `<span><i style="background:${COLORS[k]}"></i>${LABELS[k]}</span>`).join("")}</div>`;
}

function bar(counts, total) {
  return `<div class="votebar">${Object.keys(LABELS).map((k) =>
    counts[k] ? `<span style="width:${(100 * counts[k] / total).toFixed(2)}%;background:${COLORS[k]}" title="${LABELS[k]}: ${counts[k]}"></span>` : "").join("")}</div>`;
}

function login(message) {
  app.innerHTML = `
    <section class="card">
      <h2>Admin key</h2>
      <p class="muted">${esc(message || "This page is only for the site owner. Enter the ADMIN_TOKEN from your .env file.")}</p>
      <form class="login" id="login">
        <label class="sr-only" for="key">Admin key</label>
        <input id="key" type="password" autocomplete="off" placeholder="Admin key">
        <button class="btn primary">Unlock</button>
      </form>
    </section>`;
  document.getElementById("login").addEventListener("submit", (e) => {
    e.preventDefault();
    token = document.getElementById("key").value.trim();
    try { localStorage.setItem("bb_admin", token); } catch {}
    overview();
  });
}

/**
 * Custom heads waiting for review. Nothing is uploaded to Mojang until you approve it here; then the skin
 * account sets it as its skin (about one a minute) to get a signed texture. Left half of each strip is the
 * head, right half the hat layer, in the skin's own layout: top/bottom on the first row, then right, front,
 * left and back.
 */
let headTab = "pending";
async function headsSection(el) {
  let d;
  try { d = await get("/admin/heads?status=" + headTab); } catch { el.innerHTML = `<p class="empty">Couldn't load custom heads.</p>`; return; }
  const u = d.uploader;
  const upNote = !u.configured ? "Uploads are off: set SKIN_MS_CLIENT_ID and SKIN_TOKEN_KEY (docs/custom-heads-setup.md)."
    : !u.signedIn ? "The skin account isn't signed in yet. Run bb skin-login."
    : `Skin account: ${esc(u.account?.name ?? "signed in")}${u.lastUploadAt ? ` · last upload ${esc(when(u.lastUploadAt))}` : ""}`
      + (u.pausedUntil ? ` · paused until ${esc(when(u.pausedUntil))}` : "")
      + (u.lastError ? ` · last error (${esc(when(u.lastErrorAt))}): ${esc(u.lastError)}` : "");
  const TABS = { pending: `To review (${num(d.counts.pending)})`, approved: `Upload queue (${num(d.counts.approved)})`, ready: "Ready", rejected: "Rejected" };
  el.innerHTML = `
    <div class="card-head"><div><h2>Custom heads</h2>
      <p class="sub">${upNote}</p></div>
      <div class="head-tabs">${Object.entries(TABS).map(([k, label]) => `<button class="btn small" data-tab="${k}" aria-pressed="${k === headTab}">${label}</button>`).join("")}</div></div>
    ${d.heads.length ? d.heads.map((h) => `
      <div class="head-review" data-head="${h.id}">
        <div class="head-strip" style="--png:url('${h.png}')" role="img" aria-label="${esc(h.name)}" title="Click to zoom"></div>
        <div class="meta">
          <b>${esc(h.name)}</b>
          <span class="sub">by ${esc(h.player.name ?? "unknown")} (${esc(h.player.plan)}) · ${num(h.player.ready)} ready, ${num(h.player.rejected)} rejected before · sent ${esc(when(h.createdAt))}</span>
          ${h.alreadyUploaded ? `<span class="chip">Same drawing was uploaded before: no new upload needed</span>` : ""}
          ${h.status === "approved" ? `<span class="sub">${h.uploadedAt ? "Skin set, waiting for Mojang to sign it" : `Attempts: ${num(h.attempts)}${h.nextAttemptAt ? ` · next try ${esc(when(h.nextAttemptAt))}` : ""}`}${h.lastError ? ` · ${esc(h.lastError)}` : ""}</span>` : ""}
          ${h.status === "rejected" && h.rejectReason ? `<span class="sub">Reason: ${esc(h.rejectReason)}</span>` : ""}
          ${h.status === "ready" && h.textureHash ? `<span class="sub">Texture ${esc(h.textureHash.slice(0, 16))}…</span>` : ""}
        </div>
        <div class="actions">
          ${h.status === "pending" ? `
            <button class="btn small primary" data-approve="${h.id}">Approve</button>
            <input data-reason="${h.id}" placeholder="Reason (optional, shown to them)" maxlength="200">
            <button class="btn small danger" data-reject="${h.id}">Reject</button>` : ""}
          ${h.status === "approved" && !h.uploadedAt ? `
            <button class="btn small" data-retry="${h.id}">Try now</button>
            <button class="btn small danger" data-reject="${h.id}">Pull back</button>` : ""}
        </div>
      </div>`).join("") : `<p class="empty">${headTab === "pending" ? "Nothing to review." : "Nothing here."}</p>`}`;
  el.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { headTab = b.dataset.tab; headsSection(el); }));
  el.querySelectorAll(".head-strip").forEach((s) => s.addEventListener("click", () => s.classList.toggle("big")));
  const act = (attr, path, body) => el.querySelectorAll(`[${attr}]`).forEach((b) => b.addEventListener("click", async () => {
    const id = b.getAttribute(attr);
    b.disabled = true;
    try { await post(`/admin/heads/${id}/${path}`, body ? body(id) : {}); }
    catch { alert("That didn't work. Someone may have changed it already; reloading."); }
    headsSection(el);
  }));
  act("data-approve", "approve");
  act("data-retry", "retry");
  act("data-reject", "reject", (id) => ({ reason: el.querySelector(`[data-reason="${id}"]`)?.value.trim() || null }));
}

async function overview() {
  if (!token) return login();
  let players;
  try {
    players = await get("/admin/votes");
  } catch (e) {
    return login(e.message === "locked" ? "That key didn't work." : "Couldn't load votes.");
  }
  const totals = Object.fromEntries(Object.keys(LABELS).map((k) => [k, 0]));
  let all = 0;
  for (const p of players) for (const k in totals) { totals[k] += p.counts[k]; all += p.counts[k]; }

  app.innerHTML = `
    <section class="card" id="heads"><div class="loading" style="height:120px"></div></section>
    <section class="card">
      <div class="card-head">
        <div><h2>How everyone votes</h2><p class="sub">${num(all)} vote${all === 1 ? "" : "s"} from ${num(players.length)} player${players.length === 1 ? "" : "s"} using the mod. Click a player for details.</p></div>
        <button class="btn" id="lock">Lock</button>
      </div>
      ${all ? bar(totals, all) : ""}
      ${keys()}
      ${players.length ? `
      <div class="table-scroll"><table>
        <thead><tr><th>Player</th><th class="right">Votes</th><th>Spread</th><th class="right">Average (1-7)</th><th class="right">Legendary</th><th class="right">Super Poop</th></tr></thead>
        <tbody>${players.map((p) => `
          <tr data-name="${esc(p.name)}">
            <td><b>${esc(p.name)}</b></td>
            <td class="right">${num(p.total)}</td>
            <td>${bar(p.counts, p.total)}</td>
            <td class="right num">${p.average == null ? "–" : p.average.toFixed(2)}</td>
            <td class="right">${(100 * p.counts.legendary / p.total).toFixed(0)}%</td>
            <td class="right">${(100 * p.counts.super_poop / p.total).toFixed(0)}%</td>
          </tr>`).join("")}</tbody>
      </table></div>` : `<p class="empty">No votes yet. They show up after mod users play and sync.</p>`}
    </section>
    <section class="card" id="plans"><div class="loading" style="height:120px"></div></section>
    <section class="card" id="modusers"><div class="loading" style="height:120px"></div></section>
    <section class="card" id="reports"><div class="loading" style="height:120px"></div></section>
    <section class="card" id="gtb"><div class="loading" style="height:120px"></div></section>
    <section class="card" id="lobbies"><div class="loading" style="height:120px"></div></section>`;
  lobbiesSection(document.getElementById("lobbies"));
  headsSection(document.getElementById("heads"));
  planSection(document.getElementById("plans"));
  modUsersSection(document.getElementById("modusers"));
  reportsSection(document.getElementById("reports"));
  gtbSection(document.getElementById("gtb"));
  document.getElementById("lock").addEventListener("click", () => {
    token = "";
    try { localStorage.removeItem("bb_admin"); } catch {}
    login();
  });
  for (const row of app.querySelectorAll("tr[data-name]")) row.addEventListener("click", () => player(row.dataset.name));
}

async function player(name) {
  const d = await get("/admin/votes/" + encodeURIComponent(name));
  app.innerHTML = `
    <section class="card">
      <div class="card-head">
        <div><h2>${esc(d.name)}</h2><p class="sub">Who they vote for, and their latest votes</p></div>
        <button class="btn" id="back">Back</button>
      </div>
      <div class="cols">
        <div>
          <h2 style="margin-bottom:10px">Most-voted builders</h2>
          ${d.byBuilder.length ? `<div class="table-scroll"><table>
            <thead><tr><th>Builder</th><th class="right">Times</th><th class="right">Average (1-7)</th></tr></thead>
            <tbody>${d.byBuilder.map((b) => `<tr><td>${esc(b.builder)}</td><td class="right">${num(b.n)}</td><td class="right num">${b.average.toFixed(2)}</td></tr>`).join("")}</tbody>
          </table></div>` : `<p class="muted">Builder names weren't shown on any of their votes yet.</p>`}
        </div>
        <div>
          <h2 style="margin-bottom:10px">Latest votes</h2>
          <div class="list">${d.recent.map((v) => `
            <div class="row-item">
              <div class="badge" style="background:${COLORS[v.vote]};width:12px;height:36px"></div>
              <div class="row-text"><b>${LABELS[v.vote]}</b><span>${esc(v.builder ?? "unknown builder")} · ${esc(v.theme ?? "no theme")} · ${new Date(v.voted_at).toLocaleString()}</span></div>
            </div>`).join("")}</div>
        </div>
      </div>
    </section>`;
  document.getElementById("back").addEventListener("click", overview);
}

overview();
</script>
</body>
</html>
