<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Votes · Better Battle admin</title>
<link rel="stylesheet" href="/style.css">
<style>
  .votebar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--card-2); min-width: 220px; }
  .votebar span { height: 100%; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
  .keys i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .login { display: flex; gap: 8px; flex-wrap: wrap; max-width: 520px; }
  .login input { flex: 1 1 260px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.1); background: var(--card); color: var(--text); font: inherit; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: rgba(255,255,255,.02); }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 20h16"/><path d="M6 20V10l6-6 6 6v10"/><path d="M10 20v-5h4v5"/></svg>
      </span>
      <span>Better Battle</span>
    </a>
    <span class="chip pink">Admin</span>
  </header>
  <main id="app"></main>
</div>
<script type="module" src="/admin.js"></script>
</body>
</html>
