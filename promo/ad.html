<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Better Battle Promo</title>
<style>
  @font-face { font-family: "Pixelify"; src: url("PixelifySans-Variable.ttf") format("truetype"); font-weight: 400 700; }
  html, body { margin: 0; background: #000; }
  html.record, html.record body { background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Better Battle promo, 30 seconds, built on a 120 BPM grid: every cut is on a bar line
// (0, 4, 8 ... 24s) and the big hits land on beats (every 0.5s).
// Every frame is drawn from the time alone (renderAt), so the recorder can step through it.
//
// renderAt(t, { alpha })
//   alpha: false  preview. Feature sections show a stand-in for the footage you record.
//   alpha: true   master for the editor. Feature sections are transparent where footage goes.
const W = 1920, H = 1080;
const ctx = document.getElementById("c").getContext("2d");
const FONT = '"Pixelify", monospace';
const C = {
  bg: "#111114", bg2: "#17171a", gold: "#ffaa00", pink: "#ff66aa", green: "#55ff55",
  aqua: "#55ffff", white: "#f0f0f0", soft: "#c6c6c6", muted: "#9d9da6", blurple: "#8ea1ff",
};

// ---------- helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeBack = (t) => { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(",")})`;
}
function shade(rgb, k) {
  const m = rgb.match(/\d+/g).map(Number);
  return `rgb(${m.map((v) => Math.round(clamp(k > 0 ? v + (255 - v) * k : v * (1 + k), 0, 255))).join(",")})`;
}
const asRgb = (c) => (c.startsWith("#") ? mix(c, c, 0) : c);
const rgba = (hex, a) => { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; };

// A Minecraft-style block: flat face, light top-left edge, dark bottom-right edge, black outline.
function block(x, y, s, color, { alpha = 1, rot = 0, flash = 0 } = {}) {
  if (alpha <= 0 || s <= 0) return;
  const base = asRgb(color);
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x + s / 2, y + s / 2);
  if (rot) ctx.rotate(rot);
  const h = s / 2, e = Math.min(12, Math.max(2, s * 0.16));
  ctx.fillStyle = "#000"; ctx.fillRect(-h - 2, -h - 2, s + 4, s + 4);
  ctx.fillStyle = base; ctx.fillRect(-h, -h, s, s);
  ctx.fillStyle = shade(base, 0.45); ctx.fillRect(-h, -h, s, e); ctx.fillRect(-h, -h, e, s);
  ctx.fillStyle = shade(base, -0.4); ctx.fillRect(-h, h - e, s, e); ctx.fillRect(h - e, -h, e, s);
  if (flash > 0) { ctx.globalAlpha *= flash; ctx.fillStyle = "#fff"; ctx.fillRect(-h, -h, s, s); }
  ctx.restore();
}
function text(str, x, y, { size = 60, color = C.white, align = "center", weight = 700, alpha = 1, shadow = true, base = "middle" } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = base;
  if (shadow) { ctx.fillStyle = "rgba(0,0,0,0.9)"; const d = Math.max(3, size / 14); ctx.fillText(str, x + d, y + d); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function measure(str, size, weight = 700) { ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }
// Bevelled panel, like a Minecraft button or inventory slot.
function panel(x, y, w, h, fill, { alpha = 1, edge = 6 } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  const base = asRgb(fill);
  ctx.fillStyle = "#000"; ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
  ctx.fillStyle = base; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = shade(base, 0.3); ctx.fillRect(x, y, w, edge); ctx.fillRect(x, y, edge, h);
  ctx.fillStyle = shade(base, -0.45); ctx.fillRect(x, y + h - edge, w, edge); ctx.fillRect(x + w - edge, y, edge, h);
  ctx.restore();
}
// A small label that pops in with a bounce.
function chip(str, cx, cy, t, at, { color = C.gold, bg = "#4a3a10", size = 34 } = {}) {
  const q = easeBack(prog(t, at, at + 0.22));
  if (q <= 0) return;
  const w = measure(str, size) + 44, h = size + 26;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(q, q);
  panel(-w / 2, -h / 2, w, h, bg, { edge: 4 });
  text(str, 0, 2, { size, color });
  ctx.restore();
}
function bar(x, y, w, h, p, color, alpha = 1) {
  panel(x, y, w, h, "#0b0b0d", { alpha, edge: 4 });
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color;
  ctx.fillRect(x + 6, y + 6, (w - 12) * clamp(p), h - 12); ctx.restore();
}

// ---------- background, shake, flashes, dust
function background(t, { tint = C.pink, glow = 0.12 } = {}) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const s = 64, off = (t * 18) % s;
  ctx.strokeStyle = "rgba(255,255,255,0.035)"; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = -s + off; x < W + s; x += s) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -s + off * 0.5; y < H + s; y += s) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 900);
  g.addColorStop(0, rgba(tint, glow)); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const R = rng(7);
  for (let i = 0; i < 40; i++) {
    const x = (R() * W + t * (10 + R() * 30)) % W, y = (R() * H - t * (20 + R() * 40) + H * 10) % H, z = 3 + R() * 6;
    ctx.globalAlpha = 0.15 + 0.2 * Math.sin(t * 2 + i);
    ctx.fillStyle = i % 3 ? C.white : tint;
    ctx.fillRect(x, y, z, z);
  }
  ctx.globalAlpha = 1;
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.75)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function shake(t, at, power = 18, len = 0.3) {
  const p = (t - at) / len;
  if (p < 0 || p > 1) return [0, 0];
  const k = power * Math.pow(1 - p, 2);
  return [Math.sin(t * 95) * k, Math.cos(t * 83) * k];
}
const shakes = (t, list) => list.reduce((a, [at, pw]) => { const s = shake(t, at, pw); return [a[0] + s[0], a[1] + s[1]]; }, [0, 0]);
function flashOverlay(t, at, len = 0.22, max = 0.6) {
  const p = (t - at) / len;
  if (p < 0 || p > 1) return;
  ctx.fillStyle = `rgba(255,255,255,${max * (1 - p)})`; ctx.fillRect(0, 0, W, H);
}
function burst(t, at, x, y, { n = 26, color = C.white, seed = 1, spread = 520 } = {}) {
  const p = t - at;
  if (p < 0 || p > 0.8) return;
  const R = rng(seed);
  for (let i = 0; i < n; i++) {
    const a = R() * Math.PI * 2, v = spread * (0.3 + R() * 0.7), s = 6 + R() * 12;
    const px = x + Math.cos(a) * v * easeOut(p / 0.8), py = y + Math.sin(a) * v * easeOut(p / 0.8) + 300 * p * p;
    block(px, py, s * (1 - p), R() < 0.4 ? C.gold : color, { alpha: 1 - p / 0.8 });
  }
}

// ---------- the logo, built from blocks
const GLYPHS = {
  B: ["11110", "10001", "10001", "11110", "10001", "10001", "11110"],
  E: ["11111", "10000", "10000", "11110", "10000", "10000", "11111"],
  T: ["11111", "00100", "00100", "00100", "00100", "00100", "00100"],
  R: ["11110", "10001", "10001", "11110", "10100", "10010", "10001"],
  A: ["01110", "10001", "10001", "11111", "10001", "10001", "10001"],
  L: ["10000", "10000", "10000", "10000", "10000", "10000", "11111"],
  " ": ["00000", "00000", "00000", "00000", "00000", "00000", "00000"],
};
const LOGO = "BETTER BATTLE", PITCH = 22, CELL = 21;
function logoCells(cx, cy) {
  const cols = LOGO.length * 6 - 1, x0 = cx - (cols * PITCH) / 2, y0 = cy - (7 * PITCH) / 2, out = [];
  [...LOGO].forEach((ch, li) => GLYPHS[ch].forEach((row, ry) => [...row].forEach((bit, rx) => {
    if (bit === "1") out.push({ x: x0 + (li * 6 + rx) * PITCH, y: y0 + ry * PITCH, col: li * 6 + rx, cols });
  })));
  return out;
}
// The blocks fly out of `box` (the words that were there a moment ago) and lock into the logo.
function drawLogo(t, start, cx, cy, { box, sweepAt = null, seed = 3, k = 1 }) {
  const R = rng(seed);
  for (const c of logoCells(cx, cy)) {
    const sx = box.x + R() * box.w, sy = box.y + R() * box.h;
    const delay = ((c.col / c.cols) * 0.5 + R() * 0.2) * k, dur = 0.45 * k, spin = (R() - 0.5) * 8;
    const p = clamp((t - start - delay) / dur), e = easeBack(p);
    const land = p >= 1 ? clamp(1 - (t - start - delay - dur) / 0.2) : 0;
    let flash = land * 0.9;
    if (sweepAt !== null) {
      const band = (t - sweepAt) * 2600 - 300, d = Math.abs(c.x - (cx - 800) + c.y * 0.6 - band);
      flash = Math.max(flash, clamp(1 - d / 110) * 0.85);
    }
    block(lerp(sx, c.x, e), lerp(sy, c.y, e), CELL * (p < 1 ? lerp(0.6, 1, p) : 1), mix(C.gold, C.pink, c.col / c.cols),
      { rot: spin * (1 - e), flash, alpha: clamp(p * 5) });
  }
}
function ribbon(str, cx, cy, t, at, { color = C.pink, size = 46, textColor = "#fff" } = {}) {
  const p = prog(t, at, at + 0.25);
  if (p <= 0) return;
  const w = measure(str, size) + 90, h = size + 40, e = easeBack(p);
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(lerp(0.2, 1, e), lerp(1.6, 1, e));
  panel(-w / 2, -h / 2, w, h, color, { edge: 6 });
  text(str, 0, 3, { size, color: textColor });
  ctx.restore();
}
// Text that slams in: big to normal, with a flash of white.
function slam(str, cx, cy, t, at, { size = 120, color = C.white, align = "center" } = {}) {
  const p = prog(t, at, at + 0.12);
  if (p <= 0) return;
  const sc = lerp(1.7, 1, easeOut(p));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
  text(str, 0, 0, { size, color: p < 0.6 ? "#fff" : color, align, alpha: clamp(p * 3) });
  ctx.restore();
}

// ================= HOOK (0-4s) =================
// 0.00 block drops   0.28 lands   0.35-1.40 types   1.75 glitch   2.00 slam   2.50 breaks into the logo   3.00 ribbon
function sceneHook(t) {
  background(t, { tint: C.gold, glow: t < 2.5 ? 0.04 : 0.15 });
  const [sx, sy] = shakes(t, [[0.28, 14], [2.0, 26], [3.0, 14]]);
  ctx.save(); ctx.translate(sx, sy);
  const line1 = "Build Battle needed an update.", size1 = 72;
  const w1 = measure(line1, size1), x1 = W / 2 - w1 / 2;
  const typed = line1.slice(0, Math.floor(line1.length * prog(t, 0.35, 1.4)));
  const cursorX = x1 + measure(typed, size1) + 14;
  if (t < 0.35) {
    block(W / 2 - 32, lerp(-140, H / 2 - 32, easeIn(prog(t, 0, 0.28))), 64, C.gold);
  } else if (t < 1.75) {
    const m = easeOut(prog(t, 0.35, 0.5));
    text(typed, x1, H / 2 + 4, { size: size1, align: "left" });
    if (t < 1.4 || Math.floor(t * 6) % 2 === 0) block(lerp(W / 2 - 32, cursorX, m), lerp(H / 2 - 32, H / 2 - 24, m), lerp(64, 48, m), C.gold);
  }
  burst(t, 0.28, W / 2, H / 2 + 30, { n: 22, seed: 4, spread: 380 });
  if (t >= 1.75 && t < 2.0) {     // the line tears itself apart
    const R = rng(Math.floor(t * 60)), k = prog(t, 1.75, 2.0);
    for (let i = 0; i < 9; i++) {
      ctx.save();
      ctx.beginPath(); ctx.rect(0, H / 2 - 45 + i * 10, W, 10); ctx.clip();
      const dx = (R() - 0.5) * 200 * k;
      text(line1, x1 + dx - 8, H / 2 + 4, { size: size1, align: "left", color: "rgba(255,80,80,0.7)", shadow: false });
      text(line1, x1 + dx + 8, H / 2 + 4, { size: size1, align: "left", color: "rgba(80,220,255,0.7)", shadow: false });
      text(line1, x1 + dx, H / 2 + 4, { size: size1, align: "left", alpha: 1 - k * 0.6 });
      ctx.restore();
    }
  }
  const line2 = "So we built one.", size2 = 150, w2 = measure(line2, size2);
  if (t >= 2.0 && t < 2.75) {
    ctx.save(); ctx.globalAlpha = 1 - prog(t, 2.5, 2.7);
    slam(line2, W / 2, H / 2, t, 2.0, { size: size2, color: C.gold });
    ctx.restore();
  }
  if (t >= 2.5) {
    drawLogo(t, 2.5, W / 2, H / 2 - 70, { box: { x: W / 2 - w2 / 2, y: H / 2 - 70, w: w2, h: 140 }, sweepAt: 3.35, seed: 11, k: 0.75 });
    ribbon("THE SPEED BUILDERS UPDATE", W / 2, H / 2 + 110, t, 3.0);
    text("A free mod for Build Battle", W / 2, H / 2 + 210, { size: 38, color: C.soft, alpha: prog(t, 3.25, 3.45) });
  }
  burst(t, 3.0, W / 2, H / 2 + 110, { n: 30, seed: 9, color: C.pink, spread: 700 });
  ctx.restore();
  flashOverlay(t, 2.0, 0.2, 0.55);
  vignette();
}

// ================= FEATURES (4s each) =================
// The art for each feature is drawn inside an 800x640 card on the right.
function artGrade(t) {
  const p = prog(t, 1.0, 1.12), sc = lerp(2.2, 1, easeOut(p));
  ctx.save(); ctx.translate(170, 170); ctx.scale(sc, sc);
  panel(-130, -130, 260, 260, "#2a2a30", { alpha: p, edge: 8 });
  text("SS", 0, 12, { size: 170, color: C.gold, alpha: p });
  ctx.restore();
  burst(t, 1.0, 170, 170, { n: 22, seed: 21, color: C.gold, spread: 360 });
  text("Solo", 340, 80, { size: 44, align: "left", color: C.soft, alpha: prog(t, 0.6, 0.75) });
  text("1st of 16", 340, 150, { size: 64, align: "left", alpha: prog(t, 0.7, 0.85) });
  chip("+120 XP", 420, 240, t, 1.5, { color: C.green, bg: "#1d3d1d" });
  chip("NEW BEST", 640, 240, t, 1.65);
  const a = prog(t, 0.8, 0.95), cp = easeOut(prog(t, 1.2, 1.9));
  text("Crowd score", 40, 380, { size: 36, align: "left", color: C.soft, alpha: a });
  text(Math.round(94 * cp) + "%", 760, 380, { size: 36, align: "right", color: C.green, alpha: a });
  bar(40, 410, 720, 36, 0.94 * cp, C.green, a);
  const lp = easeOut(prog(t, 1.5, 2.3));
  text("Level 4", 40, 510, { size: 36, align: "left", color: C.soft, alpha: a });
  text(lp >= 1 ? "LEVEL UP!" : Math.round(lerp(640, 900, lp)) + " / 900 XP", 760, 510, { size: 36, align: "right", color: lp >= 1 ? C.gold : C.aqua, alpha: a });
  bar(40, 540, 720, 36, lerp(0.71, 1, lp), C.aqua, a);
}
function artTimer(t) {
  const run = prog(t, 0.6, 1.5), ms = Math.round(7430 * run);
  const str = `0:${String(Math.floor(ms / 1000)).padStart(2, "0")}.${String(Math.floor((ms % 1000) / 10)).padStart(2, "0")}`;
  panel(40, 30, 720, 210, "#141416", { alpha: prog(t, 0.5, 0.6), edge: 8 });
  text(str, 400, 142, { size: 160, color: run < 1 ? C.white : C.aqua, alpha: prog(t, 0.5, 0.6) });
  chip("PB  -0.82s", 190, 300, t, 1.5, { color: C.green, bg: "#1d3d1d", size: 38 });
  chip("WORLD RECORD", 580, 300, t, 2.0, { size: 38 });
  burst(t, 2.0, 580, 300, { n: 22, seed: 31, color: C.gold, spread: 380 });
  [["Round 1", "0:07.43", "PB", C.green], ["Round 2", "0:09.10", "", C.white], ["Round 3", "0:11.87", "WR", C.gold]].forEach(([n, v, tag, col], i) => {
    const q = easeOut(prog(t, 1.7 + i * 0.15, 1.95 + i * 0.15));
    if (q <= 0) return;
    const y = 370 + i * 84;
    ctx.save(); ctx.globalAlpha = q; ctx.translate((1 - q) * 80, 0);
    panel(40, y, 720, 68, "#202026", { edge: 4 });
    text(n, 66, y + 36, { size: 34, align: "left", color: C.soft });
    text(v, 560, y + 36, { size: 38, align: "right", color: col });
    if (tag) text(tag, 730, y + 36, { size: 32, align: "right", color: col });
    ctx.restore();
  });
}
function artAch(t) {
  const n = Math.round(124 * easeOut(prog(t, 0.5, 1.2)));
  text(String(n), 220, 110, { size: 170, color: C.pink, align: "center", alpha: prog(t, 0.5, 0.6) });
  text("achievements", 400, 80, { size: 44, align: "left", color: C.white, alpha: prog(t, 0.6, 0.75) });
  text("+ new challenges weekly", 400, 140, { size: 30, align: "left", color: C.muted, alpha: prog(t, 0.7, 0.85) });
  [["One Block Wonder", "+40 AP", C.gold], ["Speedrunner", "+50 AP", C.aqua], ["Photo Finish", "+20 AP", C.pink]].forEach(([name, ap, col], i) => {
    const at = 1.5 + i * 0.25, q = easeBack(prog(t, at, at + 0.25));
    if (q <= 0) return;
    const y = 240 + i * 128;
    ctx.save(); ctx.translate((1 - q) * 900, 0);
    panel(40, y, 720, 104, "#202026", { edge: 6 });
    block(62, y + 24, 56, col, { flash: clamp(1 - (t - at - 0.25) / 0.2) * (t > at + 0.25 ? 1 : 0) });
    text("Achievement unlocked", 144, y + 34, { size: 24, align: "left", color: C.muted, shadow: false });
    text(name, 144, y + 70, { size: 38, align: "left" });
    text(ap, 734, y + 54, { size: 38, align: "right", color: C.gold });
    ctx.restore();
  });
}
function artProfile(t) {
  // a share card, with a border that pulses between pink and gold
  const a = prog(t, 0.5, 0.65), pulse = 0.5 + 0.5 * Math.sin(t * 6);
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = mix(C.pink, C.gold, pulse); ctx.shadowBlur = 40 + 30 * pulse;
  ctx.fillStyle = mix(C.pink, C.gold, pulse); ctx.fillRect(34, 24, 732, 452);
  ctx.restore();
  panel(40, 30, 720, 440, "#1f1f24", { alpha: a, edge: 6 });
  ctx.save(); ctx.globalAlpha = a;
  block(70, 60, 130, "#b98f6a");                                   // a pixel face
  ctx.fillStyle = "#6b4a2f"; ctx.fillRect(70, 60, 130, 36);
  ctx.fillStyle = "#fff"; ctx.fillRect(92, 120, 32, 16); ctx.fillRect(146, 120, 32, 16);
  ctx.fillStyle = "#3b5bd6"; ctx.fillRect(108, 120, 16, 16); ctx.fillRect(146, 120, 16, 16);
  ctx.restore();
  text("YourName", 232, 92, { size: 62, align: "left", alpha: a });
  chip("Master", 296, 162, t, 0.9, { size: 28 });
  chip("Better Battle", 500, 162, t, 1.0, { size: 28, color: C.pink, bg: "#3a2030" });
  const rp = easeOut(prog(t, 1.0, 1.7));
  [["Global rank", "#" + Math.round(lerp(2400, 382, rp)), C.gold], ["Score", Math.round(82655 * rp).toLocaleString("en-US"), C.white], ["Wins", Math.round(1362 * rp).toLocaleString("en-US"), C.white]].forEach(([k, v, col], i) => {
    const x = 70 + i * 232;
    text(k, x, 258, { size: 26, align: "left", color: C.muted, alpha: a, shadow: false });
    text(v, x, 306, { size: 52, align: "left", color: col, alpha: a });
  });
  text("Level 4", 70, 372, { size: 28, align: "left", color: C.soft, alpha: a });
  bar(70, 396, 660, 30, 0.98 * easeOut(prog(t, 1.2, 1.9)), C.green, a);
  // the shutter: a white flash over the card, then the link is copied
  const f = (t - 2.0) / 0.25;
  if (f >= 0 && f <= 1) { ctx.fillStyle = `rgba(255,255,255,${0.9 * (1 - f)})`; ctx.fillRect(40, 30, 720, 440); }
  chip("Share card", 230, 550, t, 1.6, { color: "#fff", bg: "#3a3a42", size: 36 });
  chip("Link copied", 560, 550, t, 2.5, { color: C.green, bg: "#1d3d1d", size: 36 });
  burst(t, 2.5, 560, 550, { n: 16, seed: 51, color: C.green, spread: 260 });
}
function artDiscord(t) {
  const a = prog(t, 0.5, 0.65);
  panel(40, 30, 720, 84, "#2a2c36", { alpha: a, edge: 4 });
  const cmd = "/stats YourName", typed = cmd.slice(0, Math.floor(cmd.length * prog(t, 0.7, 1.4)));
  text(typed + (t < 1.5 && Math.floor(t * 6) % 2 ? "_" : ""), 70, 74, { size: 40, align: "left", color: C.blurple, alpha: a });
  const q = easeBack(prog(t, 1.5, 1.8));
  if (q > 0) {
    ctx.save(); ctx.translate(0, (1 - q) * 300); ctx.globalAlpha = clamp(q * 2);
    panel(40, 150, 720, 330, "#202229", { edge: 4 });
    ctx.fillStyle = C.pink; ctx.fillRect(40, 150, 10, 330);
    block(76, 180, 64, C.gold);
    text("Better Battle", 160, 196, { size: 28, align: "left", color: C.pink, shadow: false });
    text("YourName  |  Master", 160, 234, { size: 38, align: "left" });
    [["Global rank", "#382", C.gold], ["Wins", "1,362", C.white], ["Level", "4", C.aqua]].forEach(([k, v, col], i) => {
      const x = 76 + i * 226;
      text(k, x, 320, { size: 26, align: "left", color: C.muted, shadow: false });
      text(v, x, 370, { size: 54, align: "left", color: col });
    });
    text("Best board: Speed Builders wins", 76, 440, { size: 28, align: "left", color: C.soft, shadow: false });
    ctx.restore();
  }
  ["/compare", "/records", "/weekly"].forEach((s, i) => chip(s, 170 + i * 230, 560, t, 2.3 + i * 0.15, { color: C.blurple, bg: "#262a44", size: 34 }));
}

const FEATURES = [
  { id: "A", kicker: "STATS + LEVELS", l1: "EVERY BUILD,", l2: "GRADED.", color: C.gold, art: artGrade,
    shot: "End of a Solo game: the recap shows in chat", vo: "Every build graded. Every win ranked." },
  { id: "B", kicker: "SPEED BUILDERS", l1: "EVERY SECOND,", l2: "TIMED.", color: C.aqua, art: artTimer,
    shot: "Speed Builders round with the timer on screen", vo: "Speed Builders, with a real timer, personal bests and world records." },
  { id: "C", kicker: "ACHIEVEMENTS", l1: "EVERY GAME,", l2: "COUNTS.", color: C.pink, art: artAch,
    shot: "An achievement pops, then the Achievements screen", vo: "A hundred and twenty-four achievements, plus weekly challenges." },
  { id: "D", kicker: "YOUR PROFILE", l1: "EVERY STAT,", l2: "SHAREABLE.", color: C.green, art: artProfile,
    shot: "Your profile on battle.aspir3.net, click Share card", vo: "Your whole career on one profile. Share it anywhere." },
  { id: "E", kicker: "DISCORD BOT", l1: "EVERY FRIEND,", l2: "CHALLENGED.", color: C.blurple, art: artDiscord,
    shot: "Run /stats in the Better Battle Discord", vo: "Flex it in Discord, or call out a friend." },
];
// 0.25 line one slams   0.50 line two slams   0.35 card slides in   3.70 everything leaves
function sceneFeature(t, f, alpha) {
  if (!alpha) {           // preview: a stand-in for your footage
    ctx.fillStyle = "#0b0b0d"; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.setLineDash([24, 16]); ctx.lineDashOffset = -t * 60;
    ctx.strokeStyle = rgba(f.color, 0.6); ctx.lineWidth = 4; ctx.strokeRect(40, 40, W - 80, H - 80); ctx.restore();
    text("YOUR CLIP " + f.id, 520, 250, { size: 50, color: f.color });
    text(f.shot, 520, 320, { size: 30, color: C.white, weight: 500 });
    text('VO: "' + f.vo + '"', 520, 400, { size: 26, color: C.muted, weight: 500 });
  }
  const out = easeIn(prog(t, 3.7, 3.95)), vis = prog(t, 0.1, 0.3) * (1 - out);
  // dark plates so the words read over any footage
  let g = ctx.createRadialGradient(0, 900, 100, 0, 900, 1100);
  g.addColorStop(0, `rgba(6,6,8,${0.85 * vis})`); g.addColorStop(1, "rgba(6,6,8,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1100, H);
  g = ctx.createLinearGradient(0, 480, 0, 1080);
  g.addColorStop(0, "rgba(6,6,8,0)"); g.addColorStop(1, `rgba(6,6,8,${0.7 * vis})`);
  ctx.fillStyle = g; ctx.fillRect(0, 480, W, 600);

  const [sx, sy] = shakes(t, [[0.25, 14], [0.5, 18]]);
  ctx.save(); ctx.translate(sx - out * 500, sy); ctx.globalAlpha = 1 - out;
  const kw = measure(f.kicker, 32) + 50, kq = easeBack(prog(t, 0.15, 0.35));
  if (kq > 0) { ctx.save(); ctx.translate(100, 690); ctx.scale(kq, kq); panel(0, 0, kw, 60, f.color); text(f.kicker, kw / 2, 32, { size: 32, color: "#0b0b0d", shadow: false }); ctx.restore(); }
  ctx.save(); ctx.translate(100, 830); slam(f.l1, 0, 0, t, 0.25, { size: 112, align: "left" }); ctx.restore();
  ctx.save(); ctx.translate(100, 955); slam(f.l2, 0, 0, t, 0.5, { size: 112, align: "left", color: f.color }); ctx.restore();
  // the gold block from the hook, riding along as a bullet
  block(40, lerp(-80, 800, easeOut(prog(t, 0.05, 0.25))), 36, C.gold, { rot: (1 - prog(t, 0.05, 0.25)) * 6 });
  ctx.restore();

  const cq = easeBack(prog(t, 0.35, 0.7));
  if (cq > 0) {
    ctx.save();
    ctx.translate(1050 + (1 - cq) * 950 + out * 950, 110 + Math.sin(t * 1.6) * 6);
    ctx.rotate((1 - cq) * 0.12);
    ctx.fillStyle = "#000"; ctx.fillRect(-6, -6, 812, 652);
    ctx.fillStyle = "rgba(20,20,24,0.92)"; ctx.fillRect(0, 0, 800, 640);
    ctx.fillStyle = f.color; ctx.fillRect(0, 0, 800, 8);
    f.art(t);
    ctx.restore();
  }
}

// ================= END (24-30s) =================
// 0.5 BUILD.  1.0 BATTLE.  1.5 BETTER.  2.0 the words break into the logo  3.0 download  3.5 site
function sceneEnd(t) {
  background(t, { tint: C.pink, glow: t < 2 ? 0.05 : 0.17 });
  const [sx, sy] = shakes(t, [[0.5, 16], [1.0, 20], [1.5, 28], [3.0, 16]]);
  ctx.save(); ctx.translate(sx, sy);
  const words = [["BUILD.", C.white], ["BATTLE.", C.white], ["BETTER.", C.gold]], size = 140, gap = 50;
  const widths = words.map(([w]) => measure(w, size)), total = widths.reduce((a, b) => a + b, 0) + gap * 2;
  if (t < 2.25) {
    ctx.save(); ctx.globalAlpha = 1 - prog(t, 2.0, 2.2);
    let x = W / 2 - total / 2;
    words.forEach(([w, col], i) => { slam(w, x + widths[i] / 2, 400, t, 0.5 + i * 0.5, { size, color: col }); x += widths[i] + gap; });
    ctx.restore();
  }
  if (t >= 2.0) {
    drawLogo(t, 2.0, W / 2, 330, { box: { x: W / 2 - total / 2, y: 330, w: total, h: 140 }, sweepAt: 3.1, seed: 5, k: 0.8 });
    ribbon("DOWNLOAD FREE", W / 2, 520, t, 3.0, { color: C.green, textColor: "#0b0b0d", size: 54 });
    slam("battle.aspir3.net", W / 2, 680, t, 3.5, { size: 96, color: C.pink });
    text("Forge 1.8.9   |   Fabric 26.3", W / 2, 790, { size: 42, color: C.soft, alpha: prog(t, 4.0, 4.2) });
    text("Nothing in a game is ever paid.", W / 2, 860, { size: 34, color: C.muted, alpha: prog(t, 4.3, 4.5) });
  }
  burst(t, 3.0, W / 2, 520, { n: 30, seed: 9, color: C.green, spread: 700 });
  ctx.restore();
  flashOverlay(t, 1.5, 0.18, 0.4);
  text("Better Battle is a fan-made mod. Not affiliated with Hypixel.", W / 2, 1030, { size: 22, color: "#6a6a72", shadow: false, weight: 400, alpha: prog(t, 4.5, 4.8) });
  vignette();
}

// ================= the wipe on every cut =================
// Blocks pop in to cover the screen (0.2s before the cut), then drop away (0.3s after).
function wipe(d, seed) {
  if (d < -0.2 || d > 0.32) return;
  const R = rng(seed), s = 160;
  for (let x = 0; x < W; x += s) for (let y = 0; y < H + s; y += s) {
    const lag = (x / W) * 0.08 + R() * 0.05, tint = R(), spin = R() - 0.5;
    const col = tint > 0.93 ? C.gold : tint > 0.88 ? C.pink : mix(C.bg2, "#2e2e36", R());
    if (d < 0) {
      const p = easeOut(prog(d, -0.2 + lag, -0.03));
      block(x + (s * (1 - p)) / 2, y + (s * (1 - p)) / 2, (s + 2) * p, col);
    } else {
      const p = prog(d, lag, lag + 0.2);
      if (p < 1) block(x, y + easeIn(p) * 1000, s + 2, col, { rot: p * spin * 2 });
    }
  }
}

// ---------- timeline
const CUTS = [4, 8, 12, 16, 20, 24], TOTAL = 30;
function renderAt(t, { alpha = false } = {}) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  t = clamp(t, 0, TOTAL - 1e-6);
  if (t < 4) sceneHook(t);
  else if (t < 24) { const i = Math.floor((t - 4) / 4); sceneFeature(t - 4 - i * 4, FEATURES[i], alpha); }
  else sceneEnd(t - 24);
  CUTS.forEach((c, i) => wipe(t - c, 40 + i));
}
window.TOTAL = TOTAL;
window.renderAt = renderAt;
window.ready = document.fonts.load(`700 60px ${FONT}`).then(() => document.fonts.load(`500 60px ${FONT}`)).then(() => { renderAt(0); return true; });

// Opened in a browser: play it on a loop. Add ?alpha to see the transparent master.
const params = new URLSearchParams(location.search);
if (params.has("record")) document.documentElement.classList.add("record");
else window.ready.then(() => {
  const t0 = performance.now();
  (function frame() { renderAt(((performance.now() - t0) / 1000) % TOTAL, { alpha: params.has("alpha") }); requestAnimationFrame(frame); })();
});
</script>
