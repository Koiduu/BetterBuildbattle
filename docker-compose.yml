# Runs the whole backend on your laptop:  docker compose up -d
# Then point a Cloudflare Tunnel at localhost:3000 (website) and localhost:4000 (API).
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: betterbattle
      POSTGRES_USER: bb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db/migrations:/docker-entrypoint-initdb.d:ro   # runs 001, 002 on first start
    ports: ["127.0.0.1:5432:5432"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped

  # api:  (added once api/package.json exists)
  #   build: ./api
  #   env_file: .env
  #   ports: ["127.0.0.1:4000:4000"]
  #   depends_on: [db, redis]
  # web:  (added once web/ exists)
  #   build: ./web
  #   ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
  redisdata:
