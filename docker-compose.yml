# Runs the whole backend on your laptop:  docker compose up -d
# Then point a Cloudflare Tunnel at localhost:4000 for battle.aspir3.net (site + API under /bb/v1).
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: betterbattle
      POSTGRES_USER: bb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db/migrations:/docker-entrypoint-initdb.d:ro   # runs 001, 002 on first start
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bb -d betterbattle"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped

  # API + website (the API serves the site from /web). One container.
  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://bb:${DB_PASSWORD}@db:5432/betterbattle
      REDIS_URL: redis://redis:6379
      PORT: "4000"
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
